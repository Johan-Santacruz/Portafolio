<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Johan Balanta — Ideas que toman forma</title>
    <meta
      name="description"
      content="Johan Balanta, ingeniero de software en Cali. Diseño y desarrollo de experiencias digitales, software a medida y automatización con intención."
    />
    <meta name="author" content="Johan Camilo Balanta Santacruz" />
    <meta
      name="copyright"
      content="© 2026 Johan Camilo Balanta Santacruz. Todos los derechos reservados."
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#16110d" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icono-64.png" />
    <link rel="apple-touch-icon" href="/icono-180.png" />
    <link rel="preload" as="image" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wdth,wght@0,75..100,400..700&amp;display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@1,400&amp;display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&amp;family=Saira+Extra+Condensed:wght@700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap"
    />
    <style>
      /* Pantalla de carga: va en el HTML para que se vea antes de que llegue
         nada más. La retira `retrato/carga.ts` cuando la portada está lista. */
      #carga {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 26px;
        background: #fdfdfe;
        color: #1d1f22;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        transition: opacity 0.45s ease;
      }
      #carga[data-listo] {
        opacity: 0;
        pointer-events: none;
      }
      /* La marca: el logo tal cual, con el cursor al lado. Sin placa
         detrás, que el logo ya trae sus propias tintas. */
      .carga-marca {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .carga-logo {
        display: block;
        width: clamp(120px, 26vw, 168px);
        height: auto;
      }
      .carga-cursor {
        width: 10px;
        height: 30px;
        background: #c7ff4a;
        animation: carga-late 1s steps(2, jump-none) infinite;
      }
      @keyframes carga-late {
        50% {
          opacity: 0;
        }
      }
      .carga-linea {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 12px;
        letter-spacing: 0.14em;
        color: rgba(23, 24, 21, 0.62);
      }
      .carga-linea b {
        color: #6a8f00;
        font-weight: 700;
      }
      .carga-pista {
        width: min(260px, 60vw);
        height: 3px;
        background: rgba(23, 24, 21, 0.14);
      }
      .carga-pista span {
        display: block;
        width: 0%;
        height: 100%;
        background: #c7ff4a;
        transition: width 0.2s ease;
      }
      @media (prefers-reduced-motion: reduce) {
        .carga-cursor {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="carga" aria-hidden="true">
      <div class="carga-marca">
        <img
          class="carga-logo"
          src="/logo.png"
          alt=""
          width="360"
          height="225"
          decoding="sync"
        />
        <span class="carga-cursor"></span>
      </div>
      <p class="carga-linea">
        <b>~ $</b
        ><span
          ><span id="carga-texto">cargando</span>
          <span id="carga-num">0</span>%</span
        >
      </p>
      <div class="carga-pista"><span id="carga-barra"></span></div>
    </div>
    <script>
      /* El idioma elegido se recuerda entre visitas. Se aplica antes de que
         llegue React para que la pantalla de carga y la pestaña no salgan
         primero en español y cambien después. */
      (function () {
        var i = "es";
        try {
          var v = localStorage.getItem("portafolio:idioma");
          if (v === "es" || v === "en") i = v;
        } catch (e) {
          /* sin almacenamiento: español */
        }
        document.documentElement.lang = i;
        if (i !== "en") return;
        document.title = "Johan Balanta \u2014 Ideas that take shape";
        var d = document.querySelector('meta[name="description"]');
        if (d)
          d.setAttribute(
            "content",
            "Johan Balanta, software engineer in Cali, Colombia. Digital experiences, custom software and automation built with intent.",
          );
        var t = document.getElementById("carga-texto");
        if (t) t.textContent = "loading";
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
